name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-daemon:
    name: Build & Test Cross-Platform Daemon (Go)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Test & Build Daemon
        working-directory: daemon
        run: |
          go mod tidy
          go test -v ./...
          go build -v .

  build-macos:
    name: Build & Test macOS MenuBar App (Swift)
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Swift Build & Test
        working-directory: macOS
        run: |
          swift build -v
          swift test -v

  build-windows:
    name: Build Windows System Tray App (.NET 8)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Windows WPF App
        working-directory: windows/QuotaDock.Windows
        run: dotnet build -c Release
